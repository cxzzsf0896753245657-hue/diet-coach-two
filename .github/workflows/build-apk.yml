name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: bash scripts/patch-android.sh
      - run: npx cap sync android
      - name: Build APK (with background runner)
        id: full
        continue-on-error: true
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Fallback build without background runner
        if: steps.full.outcome == 'failure'
        run: |
          echo "背景執行外掛打包失敗，改用不含背景執行的版本" >> "$GITHUB_STEP_SUMMARY"
          node -e "const f='capacitor.config.json',c=require('./'+f);delete c.plugins;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npm uninstall @capacitor/background-runner
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - name: Verify signing key
        run: bash scripts/check-sign.sh
      - uses: actions/upload-artifact@v4
        with:
          name: diet-coach-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
